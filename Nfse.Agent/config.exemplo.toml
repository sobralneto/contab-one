# Modelo de configuração da ferramenta NFS-e.
#
# Copie para `config.toml` (que é gitignored — contém senha de certificado e a
# chave da API) e preencha com os valores reais:
#
#     copy config.exemplo.toml config.toml     (Windows)
#     cp   config.exemplo.toml config.toml     (bash)
#
# Este arquivo só guarda o que a plataforma NUNCA deve custodiar: a
# credencial da API e a senha dos certificados. Tudo o mais (tipos de nota,
# pasta de saída, geração de PDF, data de backfill, período padrão de busca)
# é configurado na tela de Configuração do painel e chega pela própria API
# no handshake — não precisa (e não deve) ser editado aqui.

# Senha usada para QUALQUER certificado cujo nome de arquivo não traga a
# senha (padrão "_s.SENHA_"). Com isso a ferramenta nunca pede senha no
# console — nem em execução manual, nem numa tarefa agendada.
senha_padrao = "TROQUE-PELA-SENHA-DOS-CERTIFICADOS"

# Exceções: certificados com senha diferente da padrão acima. A chave é o
# NOME DO ARQUIVO do certificado (não depende de nenhum padrão de nome).
#
# [senhas]
# "NomeDoCertificado.pfx" = "outra-senha-so-deste-certificado"

# Conexão com o painel SaaS — OBRIGATÓRIA. A ferramenta recusa rodar se
# "url" e "chave" não estiverem os dois preenchidos.
[api]
url = "https://api.seudominio.com.br"
chave = "nfse_a1b2c3d4_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
