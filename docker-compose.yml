name: contab-one

services:
  postgres:
    image: postgres:17-alpine
    container_name: contab-one-db
    environment:
      POSTGRES_USER: contabone
      POSTGRES_PASSWORD: contabone
      POSTGRES_DB: contab_one
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contabone -d contab_one"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
