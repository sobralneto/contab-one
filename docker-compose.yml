name: contab-one

services:
  postgres:
    image: postgres:18-alpine
    container_name: contab-one-db
    environment:
      POSTGRES_USER: contabone
      POSTGRES_PASSWORD: contabone
      POSTGRES_DB: contab_one
    ports:
      - "5432:5432"
    volumes:
      # A imagem do Postgres 18 mudou o PGDATA para
      # /var/lib/postgresql/18/docker e declara o volume um nível acima —
      # montar em /var/lib/postgresql/data deixaria os dados fora do volume.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contabone -d contab_one"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
